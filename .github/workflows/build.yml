name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v5
    - name: Install the build dependencies
      run: brew install cmake wget coreutils
    - name: Put the GNU coreutils first on PATH
      # tests/run-tests.sh needs timeout(1); macOS only ships it as gtimeout.
      run: echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
    - name: Fetch the pinned UnRAR sources
      run: scripts/bootstrap-unrar.sh
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
        cmake --build build -j "$(sysctl -n hw.activecpu)"
    - name: Test
      run: tests/run-tests.sh build/ncrar-helper
    - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
      run: |
        cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DNCRAR_SANITIZE=ON
        cmake --build build-asan -j "$(sysctl -n hw.activecpu)"
    - name: Test the sanitizer build
      env:
        # halt_on_error/abort turn a sanitizer report into a failing step instead of a log line.
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: tests/run-tests.sh build-asan/ncrar-helper
    - name: Package and verify the DMG
      run: |
        scripts/package.sh
        codesign --verify --deep --strict dist/ncrar-helper.app
        version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ncrar-helper.app/Contents/Info.plist)
        [ "$version" = "$(cat VERSION)" ] || { echo "bundle version $version != VERSION $(cat VERSION)"; exit 1; }
        archs=$(lipo -archs dist/ncrar-helper.app/Contents/MacOS/ncrar-helper)
        echo "architectures: $archs"
        [ "$archs" = "arm64" ] || { echo "unexpected architectures: $archs"; exit 1; }
        tests/run-tests.sh dist/ncrar-helper.app/Contents/MacOS/ncrar-helper
