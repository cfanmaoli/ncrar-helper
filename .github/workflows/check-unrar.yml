name: Check UnRAR upstream

# rarlab.com publishes a new UnRAR source tarball every few months. This workflow only compares the
# version pinned in scripts/bootstrap-unrar.sh with the one currently offered on rarlab.com and opens
# an issue when a newer one is available.
#
# It deliberately does not download, build or push anything: the tarball is pinned by SHA256 (see
# scripts/bootstrap-unrar.sh), and a human has to fetch the new sources, verify them and update the
# hash in a reviewed commit. That keeps an unreviewed download from being compiled inside CI and
# then pushed to main with a write token.

on:
  schedule:
    # Daily, 06:17 UTC. The minute is deliberately not :00 - GitHub's scheduler is congested there.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      outdated: ${{ steps.check.outputs.outdated }}
      pinned: ${{ steps.check.outputs.pinned }}
      latest: ${{ steps.check.outputs.latest }}
      existing_issue: ${{ steps.check.outputs.existing_issue }}
    steps:
    - uses: actions/checkout@v5
    - name: Compare the pinned version with rarlab.com
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        pinned=$(sed -n 's/^UNRAR_VERSION=//p' scripts/bootstrap-unrar.sh | head -1)
        page=$(curl -fsSL --retry 3 --max-time 30 https://www.rarlab.com/rar_add.htm) || \
          { echo '::warning::could not download the rarlab page'; exit 0; }
        latest=$(printf '%s' "$page" \
          | grep -oE 'unrarsrc-[0-9]+(\.[0-9]+)+\.tar\.gz' \
          | sed -E 's/unrarsrc-(.*)\.tar\.gz/\1/' \
          | sort -V | tail -1)
        echo "pinned=$pinned latest=$latest"
        if [ -z "$latest" ]; then
          echo '::warning::could not find an unrarsrc link on the rarlab page'
          exit 0
        fi
        existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
          --search "\"UnRAR $latest\" in:title" --json number,title \
          --jq ".[] | select(.title == \"UnRAR $latest is available\") | .number" | head -1)
        echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
        echo "latest=$latest" >> "$GITHUB_OUTPUT"
        echo "existing_issue=$existing" >> "$GITHUB_OUTPUT"
        if [ "$latest" != "$pinned" ] && \
           [ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)" = "$latest" ]; then
          echo 'outdated=true' >> "$GITHUB_OUTPUT"
        fi

  notify:
    needs: check
    if: needs.check.outputs.outdated == 'true' && needs.check.outputs.existing_issue == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Open an issue with the manual update steps
      env:
        GH_TOKEN: ${{ github.token }}
        LATEST: ${{ needs.check.outputs.latest }}
        PINNED: ${{ needs.check.outputs.pinned }}
      run: |
        body=$(cat <<'EOF'
        rarlab.com offers **UnRAR __LATEST__** (the repository pins __PINNED__).

        The sources are pinned by SHA256 so that an unreviewed download is never compiled - update both constants in `scripts/bootstrap-unrar.sh` manually:

        1. Download `https://www.rarlab.com/rar/unrarsrc-__LATEST__.tar.gz` and inspect the changelog.
        2. Record the checksum: `shasum -a 256 unrarsrc-__LATEST__.tar.gz` (cross-check it against an independent mirror if possible).
        3. Set `UNRAR_VERSION=__LATEST__` and the matching `UNRAR_SHA256` in `scripts/bootstrap-unrar.sh`, bump `VERSION` and commit the two files.
        4. Run `scripts/bootstrap-unrar.sh`, `scripts/package.sh` and `tests/run-tests.sh build/ncrar-helper`, then publish a release with the DMG and its `.sha256` file.

        Close this issue once the new version is released; the next scheduled run then reports the following upstream version.
        EOF
        )
        body=${body//__LATEST__/$LATEST}
        body=${body//__PINNED__/$PINNED}
        gh issue create --repo "$GITHUB_REPOSITORY" \
          --title "UnRAR $LATEST is available" \
          --assignee cfanmaoli \
          --body "$body"
